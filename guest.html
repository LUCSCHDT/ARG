
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Guest Panel</title>

    <script src="js/auth.js"></script>
    <script>
        Auth.requireRole("guest");
    </script>
</head>

<body style="
    background:black;
    color:white;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    height:100vh;
    margin:0;
">

    <h1>GUEST</h1>

    <button type="button">DO NOTHING</button>

    <br>

    <button onclick="Auth.logout()">LOGOUT</button>
    <h2>NEXUS NETWORK STATUS</h2>

<p id="worldStatus">Connecting...</p>

<div id="secretArchive" hidden>
    <h2>WARNING: NEW ARCHIVE DETECTED</h2>
    <p>Protocol 47 has been activated.</p>

    <a href="indice.html">
        ACCESS CLASSIFIED ARCHIVE
    </a>
</div>

<script type="module">
    import { watchWorld } from "./js/firebase.js";

    watchWorld(active => {
        document.getElementById("worldStatus")
            .textContent = active
                ? "SYSTEM COMPROMISED"
                : "SYSTEM ONLINE";

        document.getElementById("secretArchive")
            .hidden = !active;
    }).catch(console.error);
</script>

</body>
</html>
