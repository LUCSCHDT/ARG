<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Admin Panel</title>

    <script src="js/auth.js"></script>
    <script>
        Auth.requireRole("admin");
    </script>
</head>

<body style="
    background:black;
    color:red;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    height:100vh;
    margin:0;
">

    <h1>ADMIN</h1>

    <a href="indice.html">
    <img src="assets/vraiment.webp"
     alt="Document confidentiel"
     width="400">

    </a>

    <button type="button">DO NOTHING</button>

    <br>

    <button onclick="Auth.logout()">LOGOUT</button>

    <h2>GLOBAL CONTROL PANEL</h2>

<button id="activateProtocol">
    ACTIVATE PROTOCOL 47
</button>

<p id="worldStatus">Connecting to NEXUS...</p>

<script type="module">
    import {
        watchWorld,
        activateProtocol
    } from "./js/firebase.js";

    const status = document.getElementById("worldStatus");
    const button = document.getElementById("activateProtocol");

    watchWorld(active => {
        status.textContent = active
            ? "PROTOCOL 47 ACTIVE"
            : "PROTOCOL 47 INACTIVE";

        button.disabled = active;
    }).catch(console.error);

    button.addEventListener("click", async () => {
        try {
            await activateProtocol();
        } catch (error) {
            console.error(error);
            status.textContent = "ACCESS ERROR";
        }
    });
</script>

</body>
</html>
